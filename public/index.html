<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Landslide Local</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <header class="brand">
      <div class="brand-mark">LS</div>
      <div class="brand-text">
        <h1>Landslide</h1>
        <p id="runtimeState" class="runtime-state">checking runtime...</p>
      </div>
    </header>

    <!-- What is actually holding VRAM right now, and the only way to get it
         back before KEEP_ALIVE expires. Hidden entirely when nothing is
         resident, so it costs no height in the ordinary case - this column is
         already the tallest thing in the app. -->
    <div id="vram" class="vram" hidden>
      <button id="vramToggle" class="vram-toggle" type="button" aria-expanded="false" aria-controls="vramList">
        <span id="vramSummary"></span>
      </button>
      <div id="vramList" class="vram-list" hidden></div>
    </div>

    <div id="runtimeBar" class="runtime-bar" hidden>
      <span id="runtimeMsg" class="runtime-msg"></span>
      <button id="startRuntime" class="btn btn-accent btn-sm" type="button">Start Ollama</button>
    </div>

    <!-- Outside every list that gets rebuilt, so a failure message survives the
         next render instead of being wiped milliseconds after it appears. -->
    <div id="notice" class="notice" role="status" aria-live="polite" hidden>
      <span id="noticeMsg" class="notice-msg"></span>
      <button id="noticeDismiss" class="notice-x" type="button" aria-label="Dismiss">×</button>
    </div>

    <section class="panel">
      <h2 class="panel-title">Model</h2>
      <div id="modelList" class="model-list" role="radiogroup" aria-label="Choose a model"></div>
    </section>

    <!-- The primary steering lever for an uncensored tune: without explicit
         direction these models are documented as bland. The API always took a
         system prompt; until now there was nowhere to type one. -->
    <section class="panel">
      <h2 class="panel-title">System prompt</h2>
      <textarea id="systemPrompt" class="system-prompt" rows="3"
        placeholder="Tell it who to be. Blank means no steering."
        aria-label="System prompt for this chat"></textarea>
      <div class="prompt-lib">
        <select id="promptLibrary" class="search" aria-label="Saved prompts"></select>
        <div class="prompt-lib-row">
          <input id="promptName" class="search" type="text" placeholder="Save as" aria-label="Name for this prompt" />
          <button id="savePrompt" class="btn btn-sm" type="button">Save</button>
          <button id="deletePrompt" class="btn btn-sm" type="button" title="Delete the selected saved prompt">Del</button>
        </div>
      </div>
    </section>

    <section class="panel panel-grow">
      <div class="panel-head">
        <h2 class="panel-title">Chats</h2>
        <button id="newChat" class="btn btn-sm" type="button">+ New</button>
      </div>
      <input id="chatSearch" class="search" type="search" placeholder="Search chats" aria-label="Search chats" />
      <div id="chatList" class="chat-list" role="list"></div>
    </section>

    <footer class="side-foot">
      <span id="storageHint">chats on disk</span>
    </footer>
  </aside>

  <main class="main">
    <div id="thread" class="thread" aria-live="polite">
      <div class="empty" id="emptyState">
        <div class="empty-card">
          <h2>Offline. Uncensored. Yours.</h2>
          <p>Pick a model on the left and start typing. Nothing leaves this machine.</p>
          <ul id="emptyFacts" class="empty-facts"></ul>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div id="statusBar" class="status-bar" hidden>
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusLabel">Thinking</span>
        <span class="timer" id="timer">0.0s</span>
        <span id="statusMeta" class="status-meta"></span>
        <button id="stopBtn" class="btn btn-sm btn-stop" type="button">Stop</button>
      </div>

      <form id="composer" class="composer">
        <textarea id="prompt" class="prompt" rows="1" placeholder="Ask anything. Enter to send, Shift+Enter for a new line." aria-label="Message"></textarea>
        <div class="composer-foot">
          <div class="composer-hints">
            <kbd>Enter</kbd> send
            <kbd>Shift</kbd>+<kbd>Enter</kbd> newline
            <kbd>Ctrl</kbd>+<kbd>K</kbd> search
            <!-- Filled from the catalog: hardcoding "1-5" would be a lie the
                 moment models.json holds a different number. -->
            <span id="modelHint" class="model-hint" hidden></span>
            <span id="charCount" class="char-count"></span>
            <!-- Filled from the start event of every reply: what the last turn
                 actually cost against this model's window, and how many older
                 turns did not fit. -->
            <span id="contextMeter" class="context-meter" title="Estimated context used against this model's window"></span>
          </div>
          <div class="composer-actions">
            <a id="exportChat" class="btn btn-sm" download title="Download this chat as markdown">Export</a>
            <!-- Again, and Again-with-something-else. A native <select> would
                 have been less code and is not usable here: arrowing a closed
                 select fires change per option in Chrome, and every one of
                 those would replace the reply. -->
            <div class="again">
              <button id="regenerate" class="btn btn-sm btn-split-main" type="button" title="Replace the last reply with a new one">Again</button>
              <button id="regenerateWith" class="btn btn-sm btn-split-more" type="button"
                aria-haspopup="menu" aria-expanded="false" aria-controls="regenerateMenu"
                ><span class="sr-only">Retry with a different model</span></button>
              <div id="regenerateMenu" class="again-menu" role="menu" aria-label="Retry with a different model" hidden></div>
            </div>
            <button id="send" class="btn btn-accent" type="submit">Send</button>
          </div>
        </div>
      </form>
    </div>
  </main>

</div>

<template id="tpl-message">
  <article class="msg">
    <div class="msg-role"></div>
    <div class="msg-body">
      <details class="think" hidden>
        <summary><span class="think-label">Reasoning</span><span class="think-time"></span></summary>
        <div class="think-text"></div>
      </details>
      <div class="msg-text"></div>
      <div class="msg-stats"></div>
      <div class="msg-actions">
        <button class="msg-branch" type="button" hidden
          title="Copy this chat up to here into a new one and carry on separately">Branch</button>
      </div>
    </div>
  </article>
</template>

<script src="/app.js" type="module"></script>
</body>
</html>
